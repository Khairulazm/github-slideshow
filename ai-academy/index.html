<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Academy — Beginner Friendly</title>
    <meta name="description" content="A beginner-friendly AI Academy with gamification: learn AI basics, prompting, no-code tools, and ethics." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
            colors: {
              primary: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                300: '#a5b4fc',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-3">
            <div class="h-9 w-9 grid place-content-center rounded-xl bg-primary-600 text-white text-lg font-bold">AI</div>
            <div>
              <h1 class="text-lg font-bold leading-tight">AI Academy</h1>
              <p class="text-xs text-slate-500 -mt-0.5">Beginner friendly • Non-technical</p>
            </div>
          </div>
          <div class="flex items-center gap-4" id="hud">
            <div class="flex items-center gap-2">
              <span class="text-sm text-slate-500">Level</span>
              <span id="hud-level" class="px-2 py-1 rounded-lg bg-slate-100 font-semibold">1</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm text-slate-500">XP</span>
              <div class="w-32 bg-slate-100 rounded-full h-2 overflow-hidden">
                <div id="hud-xp-bar" class="h-2 bg-primary-500" style="width: 0%"></div>
              </div>
              <span id="hud-xp" class="text-sm font-medium">0</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm text-slate-500">Streak</span>
              <span id="hud-streak" class="px-2 py-1 rounded-lg bg-amber-100 text-amber-800 font-semibold">0 🔥</span>
            </div>
          </div>
        </div>
      </div>
      <nav class="border-t border-slate-200">
        <div class="max-w-6xl mx-auto px-4">
          <ul class="flex gap-2 py-2 text-sm" id="main-nav">
            <li><button data-route="dashboard" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 font-medium text-slate-700">Dashboard</button></li>
            <li><button data-route="catalog" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 font-medium text-slate-700">Learn</button></li>
            <li><button data-route="achievements" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 font-medium text-slate-700">Achievements</button></li>
            <li><button data-route="profile" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 font-medium text-slate-700">Profile</button></li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
      <div id="view" class="min-h-[60vh]"></div>
    </main>

    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden"></div>

    <footer class="border-t border-slate-200 bg-white/70 backdrop-blur">
      <div class="max-w-6xl mx-auto px-4 py-6 text-xs text-slate-500 flex items-center justify-between">
        <div>© <span id="year"></span> AI Academy. Updated to current AI standards.</div>
        <div>v<span id="app-version"></span></div>
      </div>
    </footer>

    <script src="./app.js" defer></script>
  </body>
</html>
